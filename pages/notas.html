        <main class="main-content">

            <header class="topbar">

                <button class="menu-toggle" id="menu-toggle">
                    ☰
                </button>

                <h1>NOTAS</h1>

                <div class="topbar-actions">
                    🔔
                    ⚙️
                </div>

            </header>


            <section class="content notes-page">

                <div class="page-header">

                    <div>

                        <h2>Minhas notas</h2>

                        <p>
                            Organize suas ideias e informações.
                        </p>

                    </div>


                    <button class="primary-button" id="new-note-button">
                        + Nova nota
                    </button>

                </div>


                <div class="notes-toolbar">

                    <input type="text" id="search-notes" placeholder="🔎 Pesquisar notas...">


                    <select id="filter-category">

                        <option value="all">
                            Todas as categorias
                        </option>

                        <option value="Programação">
                            Programação
                        </option>

                        <option value="Estudos">
                            Estudos
                        </option>

                        <option value="Ideias">
                            Ideias
                        </option>

                        <option value="Pessoal">
                            Pessoal
                        </option>

                    </select>

                </div>


                <div class="notes-grid" id="notes-container">

                </div>


            </section>

        </main>

    </div>


    <!-- MODAL -->

    <div class="modal hidden" id="note-modal">

        <div class="modal-content">

            <div class="modal-header">

                <h3 id="modal-title">
                    Nova nota
                </h3>

                <button id="close-modal" class="close-button">
                    ×
                </button>

            </div>


            <form id="note-form">

                <input type="hidden" id="note-id">


                <label for="note-title">
                    Título
                </label>

                <input type="text" id="note-title" placeholder="Título da nota" required>


                <label for="note-category">
                    Categoria
                </label>

                <select id="note-category">

                    <option value="Programação">
                        Programação
                    </option>

                    <option value="Estudos">
                        Estudos
                    </option>

                    <option value="Ideias">
                        Ideias
                    </option>

                    <option value="Pessoal">
                        Pessoal
                    </option>

                </select>


                <label for="note-content">
                    Conteúdo
                </label>

                <textarea id="note-content" rows="8" placeholder="Escreva sua nota..." required></textarea>


                <div class="modal-actions">

                    <button type="button" class="secondary-button" id="cancel-note">
                        Cancelar
                    </button>


                    <button type="submit" class="primary-button">
                        Salvar nota
                    </button>

                </div>

            </form>

        </div>

    </div>
